<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>자취 냉장고 레시피</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🍳 자취 냉장고 레시피</h1>
    <p>냉장고에 있는 재료를 넣으면 지금 만들 수 있는 요리를 난이도별로 알려줘요.</p>
  </header>

  <main>
    <section class="panel">
      <form id="ingredient-form" autocomplete="off">
        <input id="ingredient-input" list="ingredient-list" placeholder="재료 입력 후 Enter (예: 계란, 김치, 참치)" />
        <datalist id="ingredient-list"></datalist>
        <button type="submit">추가</button>
      </form>

      <div id="chips" class="chips"></div>

      <div class="quick">
        <span>자주 있는 재료:</span>
        <div id="quick-chips"></div>
      </div>

      <div class="options">
        <label><input type="checkbox" id="use-pantry" checked /> 기본양념은 있다고 치기
          <small>(소금·설탕·간장·식용유·고추장·된장 등)</small></label>
        <div class="levels" id="level-filter">
          <button data-level="0" class="active">전체</button>
          <button data-level="1">⭐ 초간단</button>
          <button data-level="2">⭐⭐ 보통</button>
          <button data-level="3">⭐⭐⭐ 도전</button>
        </div>
      </div>
    </section>

    <section>
      <h2>지금 바로 만들 수 있어요 <span id="ready-count" class="count"></span></h2>
      <div id="ready" class="cards"></div>
    </section>

    <section>
      <h2>재료 하나만 더 있으면 <span id="almost-count" class="count"></span></h2>
      <div id="almost" class="cards"></div>
    </section>
  </main>

  <script src="recipes.js"></script>
  <script src="matcher.js"></script>
  <script src="app.js"></script>
</body>
</html>
