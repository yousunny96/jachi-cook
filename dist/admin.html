<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>소복 어드민</title>
  <style>
    :root{--bg:#fbf6ed;--card:#fffaf2;--line:#ead8c1;--ink:#3d2a20;--sub:#7d604b;--accent:#c95a4a}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
    main{max-width:1080px;margin:0 auto;padding:24px 16px 60px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
    h1{font-size:22px;margin:0}
    h2{font-size:16px;margin:28px 0 10px}
    .who{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:13px}
    .who img{width:28px;height:28px;border-radius:50%}
    button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;cursor:pointer}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
    .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
    .stat b{display:block;font-size:26px;line-height:1.2}
    .stat span{color:var(--sub);font-size:12px}
    .table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
    table{border-collapse:collapse;width:100%;min-width:760px}
    th{white-space:nowrap}
    th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
    th{font-size:12px;color:var(--sub);font-weight:600;background:#fff3e4}
    tr:last-child td{border-bottom:0}
    .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:#f6dcd6;color:var(--accent)}
    .empty,.msg{color:var(--sub);padding:14px}
    .msg{background:var(--card);border:1px solid var(--line);border-radius:14px}
    #google-button{margin-top:14px}
  </style>
  <script defer src="recipe-drafts.js"></script><script defer src="data-japanese.js"></script><script defer src="data.js"></script>
  <script defer src="admin.js"></script>
</head>
<body><main id="root"><p class="msg">불러오는 중…</p></main></body>
</html>
